name: Publish TokenJuice Pocket

# The companion is a credential-free static PWA. This workflow publishes only
# companion/, never the engine, caches, usage snapshots, or configuration.
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: companion-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Browser import and local persistence test
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --directory companion >/tmp/tokenjuice-pocket.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/companion.test.py
          bun test tests/work-summary.test.js
          python tests/work-summary.test.py
      - name: Upload static PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: companion

  deploy:
    name: Deploy GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
